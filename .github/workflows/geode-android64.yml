name: Build Geode Android64 Mod

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 7
